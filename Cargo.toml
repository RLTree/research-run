[package]
name = "research-run"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Local-first, provenance-bound research evidence ledger"
license = "MIT"
repository = "https://github.com/RLTree/research-run"
readme = "README.md"
keywords = ["research", "provenance", "evidence", "cli"]
categories = ["command-line-utilities", "science"]

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
