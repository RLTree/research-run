[package]
name = "research-run"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "Local-first, provenance-bound research evidence ledger"
license = "MIT"
repository = "https://github.com/RLTree/research-run"
readme = "README.md"
keywords = ["research", "provenance", "evidence", "cli"]
categories = ["command-line-utilities", "science"]

[dependencies]
base64ct = { version = "1.8.0", features = ["alloc"] }
clap = { version = "4.5.41", features = ["derive"] }
ed25519-dalek = "2.2.0"
getrandom = "0.2.17"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"

[dev-dependencies]
proc-macro2 = { version = "1.0.95", features = ["span-locations"] }
syn = { version = "2.0.104", features = ["full", "visit"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
