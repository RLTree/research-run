policy_version = 1
product_language = "rust"
rust_toolchain = "1.97.1"
canonical_format = "json"
canonical_format_version = 1
unsafe_code = "forbid"
network_runtime = false
telemetry = false

[authority]
canonical_root = ".research-run"
promotion_record = "human_review_decision"
derived_outputs_can_promote = false
evidence_links_can_promote = false
retry_can_promote = false

[budgets]
max_record_bytes = 1048576
max_records_per_kind = 10000
max_snapshot_bytes = 67108864
max_text_bytes = 65536
max_list_items = 256
max_artifact_pointers = 128

[inventory_policy]
schema_version = 1
max_canonical_record_bytes = 33554432
default_max_entries = 20000
default_max_file_bytes = 2147483648
default_max_total_bytes = 8589934592
legacy_max_entries = 2048
legacy_max_file_bytes = 67108864
legacy_max_total_bytes = 536870912
explicit_u64_totals_may_exceed_64_gib = true
reference_only_content_status = "not_inspected"
child_workspace_content_status = "not_inspected"

[effects]
parse_before_write = true
workspace_confined = true
reject_symlinks = true
atomic_publication = true
idempotent_identical_retry = true
conflicting_identity = "fail_closed"

[proof]
distinct = ["source", "package", "install", "cache", "discovery", "runtime", "journey", "github", "release", "real_use", "product"]
withheld = ["scientific_truth", "real_world_usefulness", "scientific_impact", "ultragoal_install", "ultragoal_discovery", "ultragoal_runtime_activation", "full_fitted_governance"]

[release]
version = "0.1.0"
class = "technical_preview"
contract = "docs/release/0.1.0.md"
publication_authorized = false
personhood_claim = false
scientific_truth_claim = false
product_fitness_claim = "withheld_until_external_observation_and_actor_disjoint_review"

[checks]
fast = "scripts/check fast"
full = "scripts/check full"
coverage = "scripts/check coverage"
coverage_line_floor = 100
coverage_function_floor = 100
coverage_region_floor = 100
coverage_tool = "cargo-llvm-cov"
coverage_target = "product integration test"
normal_test_runner = "cargo-nextest"
doctest_runner = "cargo test --doc"
standards = "scripts/check-standards"
dependencies = "scripts/check dependencies"
mutations = "scripts/check mutations"
product_artifacts = "scripts/check artifacts"
production_source_noncomment_lines_max = 250
test_source_noncomment_lines_max = 250
function_lines_max = 80

[observations]
machine_local_only = true
regression_budget = "withheld_until_representative_history_exists"
timer_resolution_seconds = 0.01

[governance_package]
artifact = "harness-ultragoal-governance-complete.zip"
sha256 = "089382f27b64c6eb219b3a032296917dc8984129a52e56e63cb77ba66ba72377"
laws = 160
classified_items = 172
validator_issues = 0
authority = "validated_source_guidance_only"

[review]
critical_boundaries_block = true
material_rounds_max = 2
material_repair_rounds = 1
full_persona_boundaries = ["material_integration", "product", "release", "completion"]
bounded_targeted_reviews_max = 1

[governance_source]
name = "harness-ultragoal"
manifest_version = "0.0.12"
source_commit = "0355039bf621113e7089c235a298c7a8b085397f"
installed_cache_version_observed = "0.0.11"
fit_candidate = "80657ca065a93a49521f414db891dff775cf45e9"
fit_classification = "conflicting"
fit_record_status = "historical_non_authoritative"
current_fit_classification = "withheld_not_reprobed"
fit_receipt = "absent"
fit_missing_files = 67
fit_conflicts = ["AGENTS.md", "AGENT_STANDARDS.md", "ARCHITECTURE.md", "scripts/check"]
fit_plan_sha256 = "71dd2b2a2bb8246586596de234d9e5cf5b53827ea15446de78b0a0ba4efdd7a2"
fit_authorization_sha256 = "73463cb8e7e579c4a8fa67254f1f781786ed055246ea44f6989ca7dcc13f63ea"
fit_authority_manifest_sha256 = "7351910b9bb9b5bb45dd14b20c53730dfeebffc1ee4162ae2d8ec686dc51b762"
exact_source_build = "passed_locked_offline_source_only"
fit_apply = "withheld_conflicting_authority"
full_activation = false
